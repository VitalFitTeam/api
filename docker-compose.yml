version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development 
    container_name: vitalfit-app-dev
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["air"] 

  db:
    image: postgres:16.3
    container_name: postgres-db-vitalfit
    environment:
      POSTGRES_DB: vitalfit
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vitalfit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2-alpine
    restart: unless-stopped
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  redis-commander:
    container_name: redis-commander
    hostname: redis-commander
    image: rediscommander/redis-commander:latest
    environment:
    - REDIS_HOST=redis
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - redis
    restart:
      unless-stopped

volumes:
  db-data:

networks:
  backend:
    driver: bridge