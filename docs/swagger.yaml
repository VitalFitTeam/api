      produces:
      - application/json
      responses:
        "200":
          description: A list of staff users
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/authhandlers.UserResponse'
                type: array
            type: object
        "400":
          description: 'Error: Bad Request (e.g., invalid query parameters)'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 'Error: Internal Server Error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List staff users
      tags:
      - User
  /user/whoami:
    get:
      description: Retrieves the profile of the user authenticated via the JWT token
        in the request header.
      produces:
      - application/json
      responses:
        "200":
          description: "user\"\t\t\"Current authenticated user profile"
          schema:
            additionalProperties: true
            type: object
        "401":
          description: "error\":\t\"Unauthorized\"\t\"Missing or invalid JWT token"
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get current user profile
      tags:
      - User
  /wishlist:
    get:
      description: Returns all services in the authenticated user's wishlist
      parameters:
      - default: 10
        description: Number of results per page
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number for pagination
        in: query
        name: page
        type: integer
      - default: desc
        description: Sort order (asc/desc)
        enum:
        - asc
        - desc
        in: query
        name: sort
        type: string
      - description: Search term for service name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Wishlist items
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/wishlisthandlers.WishlistItemResponse'
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get user wishlist
      tags:
      - Wishlist
    post:
      consumes:
      - application/json
      description: Adds a service to the authenticated user's wishlist
      parameters:
      - description: Service ID
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/wishlisthandlers.AddToWishlistRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Service added to wishlist
          schema:
            $ref: '#/definitions/wishlisthandlers.AddToWishlistResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Service already in wishlist
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Add service to wishlist
      tags:
      - Wishlist
  /wishlist/{id}:
    delete:
      description: Removes a service from the authenticated user's wishlist
      parameters:
      - description: Wishlist Item UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Service removed from wishlist
          schema:
            $ref: '#/definitions/wishlisthandlers.RemoveFromWishlistResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Remove service from wishlist
      tags:
      - Wishlist
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
