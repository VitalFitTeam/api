info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for VitalFit, a gym system management
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: VitalFit API
paths:
  /access/check-in:
    post:
      consumes:
      - application/json
      description: 'Processes a user''s check-in attempt via a QR code JWT and branch
        ID. It follows a three-level priority flow: Confirmed Booking, Class Walk-in,
        and Open Gym access.'
      parameters:
      - description: Check-In Payload with QR Token and Branch ID
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/accesshandler.CheckInPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Access Granted
          schema:
            $ref: '#/definitions/accessdomain.CheckInResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "402":
          description: Payment Required
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Process User Check-In
      tags:
      - Access
  /access/classes/{id}/attendance:
    get:
      description: Retrieves the attendance history for a specific class
      parameters:
      - description: Class UUID
        in: path
        name: id
        required: true
        type: string
      - description: Start date filter (RFC3339 format)
        in: query
        name: start_date
        type: string
      - description: End date filter (RFC3339 format)
        in: query
        name: end_date
        type: string
      - description: Filter by status (Attended, NoShow, Cancelled)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/accesshandler.AttendanceHistoryResponse'
                type: array
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get Class Attendance History
      tags:
      - Access
  /admin/permissions:
    get:
      description: Lists all permissions defined in the system (from the seeder) that
        can be assigned to roles.
      produces:
      - application/json
      responses:
        "200":
          description: List of all permissions
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/authdomain.Permission'
                type: array
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List all available permissions
      tags:
      - RBAC (Admin)
  /admin/roles:
    get:
      consumes:
      - application/json
      description: List all roles in the system
      parameters:
      - description: Number of results per page
        in: query
        name: limit
        type: integer
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Sort order (asc/desc)
        in: query
        name: sort
        type: string
      - description: Search term for role name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success response
          schema:
            properties:
              data:
                $ref: '#/definitions/authdomain.Roles'
            type: object
        "400":
          description: 'Error: Bad Request'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List all roles
      tags:
      - RBAC (Admin)
    post:
      consumes:
      - application/json
      description: Creates a new custom role with a name, description, and an initial
        set of permission IDs.
      parameters:
      - description: Role creation payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/authhandlers.CreateRolesPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Role created successfully
        "400":
          description: 'Bad Request: Invalid payload or permissions not found'
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: 'Conflict: A role with this name already exists'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create a new custom role
      tags:
      - RBAC (Admin)
  /admin/roles/{id}:
    delete:
      description: Deletes a custom role from the system.
      parameters:
      - description: Role ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Role deleted successfully (No Content)
        "400":
          description: 'Bad Request: Invalid UUID format'
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: 'Not Found: Role not found'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Delete a role
      tags:
      - RBAC (Admin)
    get:
      description: Retrieves the details of a specific role, including its assigned
        permissions.
      parameters:
      - description: Role ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Role details response
          schema:
            $ref: '#/definitions/authdomain.Roles'
        "400":
          description: 'Bad Request: Invalid UUID format'
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: 'Not Found: Role not found'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get role by ID
      tags:
      - RBAC (Admin)
    put:
      consumes:
      - application/json
      description: Updates a role's name, description, and overwrites its assigned
        permissions with the new set provided.
      parameters:
      - description: Role ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Role update payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/authhandlers.CreateRolesPayload'
      produces:
      - application/json
      responses:
        "204":
          description: Role updated successfully
        "400":
          description: 'Bad Request: Invalid UUID or payload'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update a role
      tags:
      - RBAC (Admin)
  /admin/roles/{id}/permissions:
    delete:
      consumes:
      - application/json
      description: Revokes one or more permissions from a specific role based on the
        provided permission IDs.
      parameters:
      - description: Role ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: List of permission IDs to revoke
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/authhandlers.PermissionsPayload'
      produces:
      - application/json
      responses:
        "204":
          description: Permissions revoked successfully
        "400":
          description: 'Bad Request: Invalid UUID or payload'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Revoke permissions from a role
      tags:
      - RBAC (Admin)
    post:
      consumes:
      - application/json
      description: Assigns one or more permissions to a specific role. This is additive;
        it does not remove existing permissions.
      parameters:
      - description: Role ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: List of permission IDs to assign
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/authhandlers.PermissionsPayload'
      produces:
      - application/json
      responses:
        "204":
          description: Permissions assigned successfully
        "400":
          description: 'Bad Request: Invalid UUID or payload'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Assign permissions to a role
      tags:
      - RBAC (Admin)
  /audit-logs:
    get:
      description: Retrieves a paginated list of all audit logs.
      parameters:
      - default: 10
        description: Number of results per page
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: desc
        description: Sort order (asc/desc)
        enum:
        - asc
        - desc
        in: query
        name: sort
        type: string
      - description: Search term for path or method
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated audit logs
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/auditdomain.AuditLog'
                type: array
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get all audit logs
      tags:
      - Audit
  /audit-logs/user/{userId}:
    get:
      description: Retrieves a paginated list of audit logs for a specific user.
      parameters:
      - description: User UUID
        in: path
        name: userId
        required: true
        type: string
      - default: 10
        description: Number of results per page
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: desc
        description: Sort order (asc/desc)
        enum:
        - asc
        - desc
        in: query
        name: sort
        type: string
      - description: Search term for path or method
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated audit logs
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/auditdomain.AuditLog'
                type: array
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get user audit logs
      tags:
      - Audit
  /auth/activate:
    put:
      consumes:
      - application/json
      description: Activates a user's account using the invitation code/token.
      parameters:
      - description: Activation Code
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/authhandlers.CodePayload'
      produces:
      - application/json
      responses:
        "204":
          description: User successfully activated. No content returned.
        "400":
          description: Bad request (e.g., invalid JSON payload)
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Code is invalid or expired (handled by the service layer returning
            ErrNotFound)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error (e.g., database connection issue)
          schema:
            additionalProperties: true
            type: object
      summary: Activate user account
      tags:
      - User
  /auth/activate/{token}:
    put:
      consumes:
      - application/json
      description: Activates a staff user's account using the invitation token from
        the URL and sets their initial password.
      parameters:
      - description: Activation Token
        in: path
        name: token
        required: true
        type: string
      - description: Password Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/authhandlers.UpdateStaffPasswordPayload'
      produces:
      - application/json
      responses:
        "204":
          description: User successfully activated and password set. No content returned.
        "400":
          description: Bad request (e.g., invalid JSON payload, passwords do not match)
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Token is invalid or expired
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Activate staff user account
      tags:
      - User
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates the user with email and password, returning an access
        token upon success.
      parameters:
      - description: User login credentials (email and password)
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/authhandlers.CreateUserTokenPayload'
      produces:
      - application/json
      responses:
        "200":
          description: "token\"\t\t\"Successfully generated JWT access token"
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: "error\":\t\"Invalid request body"
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: "error\":\t\"Unauthorized\"\t\t\t\t\t\t\"Invalid credentials
            (password mismatch)"
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: "error\":\t\"not found\"\t\t\t\t\t\t\t\"User with the given
            email not found"
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: "error\":\t\"the server encountered a problem\"\t\"Internal
            server error during token generation or hashing"
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logs in a user and issues a JWT token
      tags:
      - Auth
  /auth/oauth-login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticates a user using a Clerk session token (JWT). The backend verifies the token
        using Clerk's JWKS and extracts the user's identity securely.
      parameters:
      - description: OAuth session token payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/authhandlers.OAuthLoginPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Internal JWT generated
          schema:
            properties:
              token:
                type: string
            type: object
        "400":
          description: Invalid payload
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Invalid OAuth session token
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: User not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal server error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Login with OAuth provider (Google, etc.)
      tags:
      - Auth
  /auth/password/forgot:
    post:
      consumes:
      - application/json
      description: Envía un código OTP al correo electrónico proporcionado para iniciar
        el proceso de reseteo de contraseña.
      parameters:
      - description: Estructura que contiene el correo del usuario
        in: body
        name: email
        required: true
        schema:
          $ref: '#/definitions/authhandlers.ForgotPasswordPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Si el correo existe, el proceso de token ha sido exitoso (por
            seguridad, el mensaje no confirma la existencia del correo).
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request - Datos de entrada inválidos (ej. formato de email
            incorrecto)
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error - Error al generar el token, al acceder
            a la DB, o al enviar el correo.
          schema:
            additionalProperties: true
            type: object
      summary: Solicitar token de reseteo de contraseña
      tags:
      - Auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: Finalizes the password reset process by validating the token and
        updating the user's password hash.
      parameters:
      - description: Reset token and new password data (must include password confirmation).
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/authhandlers.ResetPasswordPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated successfully.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request - Invalid data (expired token, token not found,
            or passwords do not match).
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error - Error while hashing the password or
            executing the DB transaction.
          schema:
            additionalProperties: true
            type: object
      summary: Execute Password Reset
      tags:
      - Auth
  /auth/password/validate/{token}:
    get:
      description: Checks if a password reset token is valid and has not expired.
      parameters:
      - description: Password Reset Token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Token is valid.
        "404":
          description: Token is invalid or has expired.
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal server error.
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Validate Password Reset Token
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates the refresh token and issues a new access token.
      parameters:
      - description: Refresh Token Payload
        in: body
        name: payload
