info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for VitalFit, a gym system management
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: VitalFit API
paths:
  /admin/permissions:
    get:
      description: Lists all permissions defined in the system (from the seeder) that
        can be assigned to roles.
      produces:
      - application/json
      responses:
        "200":
          description: List of all permissions
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/authdomain.Permission'
                type: array
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List all available permissions
      tags:
      - RBAC (Admin)
  /admin/roles:
    get:
      consumes:
      - application/json
      description: List all roles in the system
      produces:
      - application/json
      responses:
        "200":
          description: Success response
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/authdomain.Roles'
                type: array
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List all roles
      tags:
      - RBAC (Admin)
    post:
      consumes:
      - application/json
      description: Creates a new custom role with a name, description, and an initial
        set of permission IDs.
      parameters:
      - description: Role creation payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/authhandlers.CreateRolesPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Role created successfully
        "400":
          description: 'Bad Request: Invalid payload or permissions not found'
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: 'Conflict: A role with this name already exists'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create a new custom role
      tags:
      - RBAC (Admin)
  /admin/roles/{id}:
    delete:
      description: Deletes a custom role from the system.
      parameters:
      - description: Role ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Role deleted successfully (No Content)
        "400":
          description: 'Bad Request: Invalid UUID format'
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: 'Not Found: Role not found'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Delete a role
      tags:
      - RBAC (Admin)
    get:
      description: Retrieves the details of a specific role, including its assigned
        permissions.
      parameters:
      - description: Role ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Role details response
          schema:
            $ref: '#/definitions/authdomain.Roles'
        "400":
          description: 'Bad Request: Invalid UUID format'
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: 'Not Found: Role not found'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get role by ID
      tags:
      - RBAC (Admin)
    put:
      consumes:
      - application/json
      description: Updates a role's name, description, and overwrites its assigned
        permissions with the new set provided.
      parameters:
      - description: Role ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Role update payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/authhandlers.CreateRolesPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Role updated successfully
        "400":
          description: 'Bad Request: Invalid UUID or payload'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update a role
      tags:
      - RBAC (Admin)
  /admin/roles/{id}/permissions:
    delete:
      consumes:
      - application/json
      description: Revokes one or more permissions from a specific role based on the
        provided permission IDs.
      parameters:
      - description: Role ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: List of permission IDs to revoke
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/authhandlers.PermissionsPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Permissions revoked successfully
        "400":
          description: 'Bad Request: Invalid UUID or payload'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: 'Error: Internal server error'
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Revoke permissions from a role
      tags:
